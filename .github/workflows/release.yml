name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC). Provenance is attached automatically.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Check that the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Smoke test
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node pinskills.mjs unknown-command || test $? -eq 2
      - run: npm publish --access public
